name: Health Signal CD

on:
  workflow_run:
    workflows: ["Health Signal CI"]
    types:
      - completed
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Deploy
        run: |
          cd /opt/health-signal
          git pull origin main
          docker compose up -d --build
